# DLT Pipeline Configuration
resources:
  pipelines:
    analytics_dlt_pipeline:
      name: "${bundle.environment}_analytics_pipeline"
      target: "${var.catalog}.${var.schema}"

      # Pipeline configuration
      libraries:
        - notebook:
            path: ../src/pipelines/product_analytics_dlt.py

      # Cluster configuration
      clusters:
        - label: default
          node_type_id: Standard_D4ds_v5
          spark_version: 17.3.x-scala2.13
          autotermination_minutes: 5
          autoscale:
            min_workers: 1 # Minimum workers
            max_workers: 5 # Maximum workers


      # Development vs Production settings
      development: ${bundle.target == 'dev'}
      continuous: false

      # Channel (preview or current)
      channel: CURRENT

      # Edition (CORE, PRO, ADVANCED)
      edition: ADVANCED

      # Email notifications
      notifications:
        - email_recipients:
            - ${var.notification_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure

      # Catalog settings
      catalog: ${var.catalog}

      # Photon enabled
      photon: true

      # Data quality expectations
      configuration:
        pipeline.deployment.kind: "INCREMENTAL"
