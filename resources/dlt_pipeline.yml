# DLT Pipeline Configuration
resources:
  pipelines:
    analytics_dlt_pipeline:
      name: analytics_dlt_pipeline
      target: "${var.schema}"

      # Pipeline configuration
      libraries:
        - notebook:
            path: ../src/pipelines/product_analytics_dlt.py

      # Cluster configuration (classic job cluster)
      clusters:
        - label: default
          node_type_id: Standard_D4ds_v5
          autoscale:
            min_workers: 1
            max_workers: 5

      # Development vs Production settings
      development: ${bundle.target == 'dev'}
      continuous: false

      # Catalog settings
      catalog: ${var.catalog}

      # Pipeline configuration
      configuration:
        pipeline.deployment.kind: "INCREMENTAL"
        storage_credential: satdataaccess
