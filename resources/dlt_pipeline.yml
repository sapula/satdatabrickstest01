# DLT Pipeline Configuration
resources:
  pipelines:
    analytics_dlt_pipeline:
      name: "${bundle.environment}_analytics_pipeline"
      target: "${var.catalog}_${bundle.environment}.${var.schema}"

      # Pipeline configuration
      libraries:
        - notebook:
            path: ../src/pipelines/product_analytics_dlt.py

      # Serverless compute
      serverless: true

      # Development vs Production settings
      development: ${bundle.target == 'dev'}
      continuous: false

      # Channel (preview or current)
      channel: CURRENT

      # Edition (CORE, PRO, ADVANCED)
      edition: ADVANCED

      # Email notifications
      notifications:
        - email_recipients:
            - ${var.notification_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure

      # Catalog settings
      catalog: ${var.catalog}_${bundle.environment}

      # Photon enabled
      photon: true

      # Data quality expectations
      configuration:
        pipeline.deployment.kind: "INCREMENTAL"
