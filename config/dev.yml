# Development Environment Configuration
environment: dev

# Databricks workspace settings
workspace:
  profile: DEFAULT

# Catalog and schema
catalog: tpccopy001
schema: poc

# Pipeline settings
pipeline:
  num_workers: 1
  node_type_id: Standard_D4ds_v5
  continuous: false
  development: true

# Notifications
notification_email: pula.sateesh@gmail.com

# Service principal (leave empty for dev, uses user auth)
service_principal_id: ""

# Feature flags
features:
  enable_data_quality_checks: true
  enable_photon: true
  enable_cdc: true
